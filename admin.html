
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Add Products</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #e8f1ff;
  margin: 0;
  padding: 25px;
}
.box {
  max-width: 500px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 15px #0002;
}
h2 { color: #10233f; text-align: center; }
input, textarea, button {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin: 8px 0;
}
button {
  background: #10233f;
  color: white;
  border: 0;
  border-radius: 5px;
  cursor: pointer;
}
#dashboard { display: none; }
#message { overflow-wrap: anywhere; }
#preview {
  display: none;
  max-width: 100%;
  max-height: 220px;
  object-fit: contain;
  margin: 10px auto;
}
</style>
</head>

<body>
<div class="box">
  <h2>Admin Login</h2>

  <input id="email" type="email" placeholder="Admin Email" required>
  <input id="password" type="password" placeholder="Password" required>
  <button id="loginBtn">Login</button>
  <p id="message" role="status"></p>

  <div id="dashboard">
    <h2>Add New Product</h2>

    <form id="productForm">
      <input id="name" placeholder="Product Name" required>

      <input
        id="image"
        type="url"
        placeholder="Paste GitHub Image URL"
        required
      >

      <img id="preview" alt="Product image preview">

      <textarea
        id="description"
        placeholder="Product Description"
        required
      ></textarea>

      <button id="addBtn" type="submit">Add Product</button>
    </form>

    <button id="logoutBtn">Logout</button>
  </div>
</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyADkR1H2zyHk5SBDWbpMKJpCtsZFNneo",
  authDomain: "shanthi-engineering-works.firebaseapp.com",
  projectId: "shanthi-engineering-works",
  storageBucket: "shanthi-engineering-works.firebasestorage.app",
  messagingSenderId: "619909039011",
  appId: "1:619909039011:web:a561d677705bedefb4d016",
  measurementId: "G-GDQ266ET18"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const adminEmail = "renukavarala6@gmail.com";
const message = document.getElementById("message");
const dashboard = document.getElementById("dashboard");
const loginBtn = document.getElementById("loginBtn");
const productForm = document.getElementById("productForm");
const addBtn = document.getElementById("addBtn");
const imageInput = document.getElementById("image");
const preview = document.getElementById("preview");

function showAdmin(user) {
  const isAdmin =
    user && user.email?.toLowerCase() === adminEmail.toLowerCase();

  dashboard.style.display = isAdmin ? "block" : "none";
  loginBtn.style.display = isAdmin ? "none" : "block";

  document.getElementById("email").style.display =
    isAdmin ? "none" : "block";

  document.getElementById("password").style.display =
    isAdmin ? "none" : "block";
}

onAuthStateChanged(auth, (user) => {
  showAdmin(user);

  if (user && user.email?.toLowerCase() === adminEmail.toLowerCase()) {
    message.textContent = "Admin logged in.";
  }
});

loginBtn.onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    message.textContent = "Enter email and password.";
    return;
  }

  loginBtn.disabled = true;

  try {
    const result = await signInWithEmailAndPassword(auth, email, password);

    if (result.user.email?.toLowerCase() !== adminEmail.toLowerCase()) {
      await signOut(auth);
      throw new Error("Admin access denied.");
    }

    showAdmin(result.user);
    message.textContent = "Login successful.";
  } catch (error) {
    message.textContent = "Login failed. Check credentials and Firebase settings.";
  } finally {
    loginBtn.disabled = false;
  }
};

imageInput.addEventListener("input", () => {
  const url = imageInput.value.trim();

  if (url.startsWith("https://")) {
    preview.src = url;
    preview.style.display = "block";
  } else {
    preview.removeAttribute("src");
    preview.style.display = "none";
  }
});

preview.onerror = () => {
  preview.style.display = "none";
  message.textContent = "Image URL open avvatledu. Correct image URL use cheyyi.";
};

productForm.onsubmit = async (event) => {
  event.preventDefault();

  const user = auth.currentUser;

  if (!user || user.email?.toLowerCase() !== adminEmail.toLowerCase()) {
    message.textContent = "Please login as admin first.";
    return;
  }

  const name = document.getElementById("name").value.trim();
  const description = document.getElementById("description").value.trim();
  const imageURL = imageInput.value.trim();

  if (!name || !description || !imageURL.startsWith("https://")) {
    message.textContent = "Enter product name, description and HTTPS image URL.";
    return;
  }

  addBtn.disabled = true;
  message.textContent = "Saving product...";

  try {
    await addDoc(collection(db, "products"), {
      name: name,
      image: imageURL,
      description: description,
      createdAt: serverTimestamp()
    });

    message.textContent = "Product added to Firestore successfully!";
    productForm.reset();
    preview.removeAttribute("src");
    preview.style.display = "none";
  } catch (error) {
    console.error(error);
    message.textContent =
      "Save failed. Check Firestore security rules and database settings.";
  } finally {
    addBtn.disabled = false;
  }
};

document.getElementById("logoutBtn").onclick = async () => {
  try {
    await signOut(auth);
    dashboard.style.display = "none";
    loginBtn.style.display = "block";
    document.getElementById("email").style.display = "block";
    document.getElementById("password").style.display = "block";
    message.textContent = "Logged out.";
  } catch (error) {
    message.textContent = "Logout failed. Please try again.";
  }
};
</script>
</body>
</html>
